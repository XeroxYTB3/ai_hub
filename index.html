<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1112">
<title>AI Hub Remote</title>
<style>
:root{--bg:#f7f7f5;--sf:#fff;--rs:#efeee9;--ln:#e2e0d9;--tx:#1a1a18;--dm:#66655f;--ac:#0f766e;--on:#fff;--ok:#16a34a;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f1112;--sf:#171a1b;--rs:#0b0d0e;--ln:#26292b;--tx:#e8e8e5;--dm:#9a9b96;--ac:#5eead4;--on:#06201c}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln);background:var(--sf)}
header h1{flex:1;margin:0;font-size:16px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
button.ic{width:38px;padding:8px 0;text-align:center;font-size:18px;line-height:1}
button[hidden]{display:none}
main{flex:1;overflow:auto;padding:12px;max-width:760px;width:100%;margin:0 auto}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:14px}
.card b{display:block}.card small{color:var(--dm)}.card .sp{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dm);flex:none}.dot.on{background:var(--ok)}.dot.bad{background:var(--er)}
.dim{color:var(--dm)}.empty{text-align:center;padding:40px 12px;color:var(--dm)}
.msgs{display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;border:1px solid var(--ln);background:var(--sf)}
.m.user{align-self:flex-end;background:var(--ac);color:var(--on);border-color:var(--ac)}
.m.sys{align-self:center;font-size:12.5px;color:var(--dm);background:transparent;border-style:dashed}
.m pre{margin:6px 0 0;padding:8px;background:var(--rs);border-radius:8px;overflow:auto;font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.run{align-self:flex-start;color:var(--dm);font-size:13px}
#bar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);background:var(--sf)}
#bar[hidden]{display:none}
#in{flex:1;resize:none;max-height:160px;padding:9px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style></head><body>
<header><button id="back" class="ic" hidden aria-label="Retour">‹</button><h1 id="ttl">AI Hub</h1><button id="add" class="ic" aria-label="Ajouter un PC">+</button></header>
<main id="v"></main>
<div id="bar" hidden><textarea id="in" rows="1" placeholder="Écris ta demande…"></textarea><button id="stop" class="ic" hidden aria-label="Arrêter">■</button><button id="go" class="pri">Envoyer</button></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let pcs=LS.get('aihubPCs',[]);
const links={},chats={};
let view={pc:null,pid:null},peer=null,peerOk=false,tt=0;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function parseLink(u){try{const h=String(u).split('#')[1]||'';const p=new URLSearchParams(h);const id=p.get('pc'),k=p.get('k');if(!id||!k||!/^aihub-[a-z0-9]{6,40}$/.test(id)||!/^[a-z0-9]{8,64}$/.test(k))return null;return{id,k,n:p.get('n')||'Mon PC'}}catch{return null}}
function save(){LS.set('aihubPCs',pcs)}
function addPC(o){const i=pcs.findIndex(x=>x.id===o.id);if(i>=0)Object.assign(pcs[i],o);else pcs.push(o);if(links[o.id])links[o.id].denied=false;save();connect(pcs.find(x=>x.id===o.id));render()}
function connect(pc){
  const L=links[pc.id]||(links[pc.id]={online:false,projects:[]});
  if(!peer||!peerOk||L.denied||L.busy)return;if(L.c&&L.c.open)return;
  L.busy=true;let c;try{c=peer.connect(pc.id,{reliable:true})}catch{L.busy=false;return}
  L.c=c;
  const fail=()=>{if(L.c!==c)return;L.busy=false;L.online=false;try{c.close()}catch{}render();setTimeout(()=>{if(pcs.some(x=>x.id===pc.id))connect(pc)},7000)};
  const to=setTimeout(()=>{if(!L.online)fail()},10000);
  c.on('open',()=>c.send({t:'auth',k:pc.k}));
  c.on('data',d=>{clearTimeout(to);onData(pc,L,d)});
  c.on('close',()=>{clearTimeout(to);fail()});c.on('error',()=>{clearTimeout(to);fail()});
}
function onData(pc,L,d){
  if(!d||!d.t)return;
  if(d.t==='hello'){L.online=true;if(d.name&&d.name!==pc.n){pc.n=d.name;save()}L.c.send({t:'list'});if(view.pc===pc.id&&view.pid)L.c.send({t:'open',pid:view.pid})}
  else if(d.t==='deny'){L.denied=true;L.online=false;toast('Code refusé par '+pc.n)}
  else if(d.t==='projects')L.projects=d.items||[];
  else if(d.t==='chat')chats[pc.id+'|'+d.pid]=d;
  else if(d.t==='ack')toast('Envoyé');
  else if(d.t==='err')toast(d.m||'Erreur');
  render();
}
function startPeer(){
  if(typeof Peer==='undefined'){render();return}
  peer=new Peer();
  peer.on('open',()=>{peerOk=true;pcs.forEach(connect);render()});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch{}});
  peer.on('error',e=>{if(e&&e.type!=='peer-unavailable'){peerOk=false;render();setTimeout(()=>{try{peer.destroy()}catch{}peer=null;startPeer()},6000)}});
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function fmt(box,t){
  String(t||'').split(/```[\w+-]*\n?/).forEach((part,i)=>{if(i%2){const p=el('pre');p.textContent=part.replace(/\n$/,'');box.appendChild(p)}else if(part.trim()){const s=el('span');s.textContent=part.replace(/^\n+|\n+$/g,'');box.appendChild(s)}});
}
function render(){
  const v=$('#v'),bar=$('#bar'),back=$('#back'),ttl=$('#ttl');
  back.hidden=!view.pc;bar.hidden=!view.pid;$('#add').hidden=!!view.pc;
  if(!view.pc){
    ttl.textContent='Mes PC';v.textContent='';
    if(typeof Peer==='undefined'){v.appendChild(el('div','empty','Impossible de charger la connexion (PeerJS). Vérifie ta connexion internet.'));return}
    if(!pcs.length){v.appendChild(el('div','empty','Aucun PC. Dans AI Hub : Paramètres › Général › Contrôle à distance, active l’option puis ouvre le lien ou scanne le QR code sur cet appareil.'));return}
    pcs.forEach(pc=>{const L=links[pc.id]||{};const b=el('div','card');b.style.cursor='pointer';b.style.border='1px solid var(--ln)';b.style.background='var(--sf)';
      b.appendChild(el('i','dot'+(L.online?' on':L.denied?' bad':'')));
      const sp=el('div','sp');sp.appendChild(el('b','',pc.n));sp.appendChild(el('small','',L.online?'en ligne · '+(L.projects||[]).length+' projet(s)':L.denied?'code refusé : rescanne le lien':peerOk?'hors ligne (AI Hub ouvert sur ce PC ?)':'connexion…'));b.appendChild(sp);
      const x=el('button','ic','×');x.title='Retirer ce PC';x.onclick=e=>{e.stopPropagation();if(confirm('Retirer « '+pc.n+' » de cet appareil ?')){pcs=pcs.filter(q=>q.id!==pc.id);save();try{links[pc.id]&&links[pc.id].c&&links[pc.id].c.close()}catch{}delete links[pc.id];render()}};b.appendChild(x);
      b.onclick=()=>{if(!L.online)return toast('Ce PC est hors ligne');view={pc:pc.id,pid:null};render()};v.appendChild(b)});
    return}
  const pc=pcs.find(x=>x.id===view.pc),L=links[view.pc]||{};
  if(!pc){view={pc:null,pid:null};return render()}
  if(!view.pid){
    ttl.textContent=pc.n;v.textContent='';
    if(!L.online){v.appendChild(el('div','empty','PC hors ligne.'));return}
    if(!(L.projects||[]).length){v.appendChild(el('div','empty','Aucun projet sur ce PC.'));return}
    L.projects.forEach(p=>{const b=el('button','card');b.style.border='1px solid var(--ln)';
      b.appendChild(el('i','dot'+(p.run?' on':'')));const sp=el('div','sp');sp.appendChild(el('b','',p.name));sp.appendChild(el('small','',(p.local?'dossier local':'en ligne')+(p.run?' · en cours…':'')));b.appendChild(sp);
      b.onclick=()=>{view.pid=p.id;try{L.c.send({t:'open',pid:p.id})}catch{}render();setTimeout(()=>$('#in').focus(),50)};v.appendChild(b)});
    return}
  const pr=(L.projects||[]).find(p=>p.id===view.pid);ttl.textContent=(pr?pr.name:'Projet')+' · '+pc.n;
  const d=chats[view.pc+'|'+view.pid]||{msgs:[]};
  $('#stop').hidden=!d.run;
  const key=d.msgs.length+':'+((d.msgs[d.msgs.length-1]||{}).t||'').length+':'+(d.run?1:0);
  if(v.dataset.k===key&&v.firstElementChild&&v.firstElementChild.className==='msgs')return;
  const near=v.scrollHeight-v.scrollTop-v.clientHeight<160||v.dataset.k===undefined||v.dataset.k==='';
  v.dataset.k=key;v.textContent='';const w=el('div','msgs');
  if(!d.msgs.length)w.appendChild(el('div','empty','Écris ta première demande pour ce projet.'));
  d.msgs.forEach(m=>{const b=el('div','m '+(m.r==='user'?'user':m.r==='ai'?'ai':'sys'));fmt(b,m.t);w.appendChild(b)});
  if(d.run)w.appendChild(el('div','run','AI Hub travaille…'));
  v.appendChild(w);if(near)v.scrollTop=v.scrollHeight;
}
function go(){
  const t=$('#in').value.trim();if(!t)return;const L=links[view.pc];
  if(!L||!L.c||!L.c.open||!L.online)return toast('PC hors ligne');
  L.c.send({t:'send',pid:view.pid,text:t});$('#in').value='';autoh();
}
function autoh(){const i=$('#in');i.style.height='auto';i.style.height=Math.min(160,i.scrollHeight)+'px'}
$('#go').onclick=go;
$('#stop').onclick=()=>{const L=links[view.pc];if(L&&L.c&&L.c.open)L.c.send({t:'stop',pid:view.pid})};
$('#in').addEventListener('input',autoh);
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();go()}});
$('#back').onclick=()=>{if(view.pid){view.pid=null;$('#v').dataset.k=''}else view.pc=null;render()};
$('#add').onclick=()=>{const u=prompt('Colle le lien de connexion affiché dans AI Hub (Paramètres › Général › Contrôle à distance) :');if(!u)return;const o=parseLink(u);if(!o)return toast('Lien invalide');addPC(o);toast('PC ajouté')};
{const o=parseLink(location.href);if(o){addPC(o);try{history.replaceState(null,'',location.pathname+location.search)}catch{}}}
render();startPeer();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pcs.forEach(connect)});
})();
</script></body></html>
