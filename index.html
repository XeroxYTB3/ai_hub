(function(){

const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

const links={},chats={};
let view={pc:null,pid:null},peer=null,peerOk=false,tt=0;
const BT=String.fromCharCode(96),FENCE=new RegExp(BT+BT+BT+'[\\w+-]*\\n?');
const P={back:'<path d="m15 18-6-6 6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',mon:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',chev:'<path d="m9 6 6 6-6 6"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',clip:'<path d="m21 12-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.6 8.6a2 2 0 0 1-3-3L15 8"/>',panel:'<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/>'};

function addPC(o){const i=pcs.findIndex(x=>x.id===o.id);if(i>=0)Object.assign(pcs[i],o);else pcs.push(o);if(links[o.id])links[o.id].denied=false;save();connect(pcs.find(x=>x.id===o.id));render()}
function connect(pc){
  const L=links[pc.id]||(links[pc.id]={online:false,projects:[]});
  if(!peer||!peerOk||L.denied||L.busy)return;if(L.c&&L.c.open)return;

function onData(pc,L,d){

let pairFailCb=null;
const devName=()=>{const u=navigator.userAgent;return /iPhone|iPad/.test(u)?'iPhone':/Android/.test(u)?'Android':/Windows/.test(u)?'PC Windows':/Mac/.test(u)?'Mac':'Navigateur'};
function pairWith(code,done){
  let n=0;
  const go=()=>{if(peerOk)return run();if(++n>40)return done('Pas de connexion au service (hors ligne ?)');setTimeout(go,250)};
  function run(){
    let fin=false;const c=peer.connect('aihub-pair-'+code,{reliable:true});
    const end=m=>{if(fin)return;fin=true;clearTimeout(to);pairFailCb=null;try{c.close()}catch{}done(m)};
    const to=setTimeout(()=>end('Code introuvable ou expiré'),75000);
    pairFailCb=end;
    c.on('open',()=>c.send({t:'pair',name:devName()}));
    c.on('data',d=>{
      if(d&&d.t==='paired'&&typeof d.tok==='string'&&/^aihub-[a-z0-9]{6,40}$/.test(d.id||'')){fin=true;clearTimeout(to);pairFailCb=null;addPC({id:d.id,tok:d.tok,n:String(d.name||'Mon PC').slice(0,40)});done(null);try{c.close()}catch{}}
      else if(d&&d.t==='deny')end('Refusé sur le PC')});
    c.on('error',()=>end('Connexion impossible'));
  }
  go()}
async function scanQR(v,cb){
  if(!('BarcodeDetector' in window)){toast('Scanner indisponible ici : utilise l’appareil photo du téléphone');return null}

  const det=new BarcodeDetector({formats:['qr_code']});
  v.srcObject=st;v.hidden=false;v.muted=true;v.setAttribute('playsinline','');try{await v.play()}catch{}
  let on=true;const stop=()=>{on=false;try{st.getTracks().forEach(t=>t.stop())}catch{}v.hidden=true};
  (async()=>{while(on){try{const r=await det.detect(v);for(const x of r){const m=/(?:c=|^)(\d{6})\b/.exec(x.rawValue||'');if(m){stop();cb(m[1]);return}}}catch{}await new Promise(r=>setTimeout(r,250))}})();

function blocks(box,s){

      while(i<L.length&&rx.test(L[i])){const li=el('li');inl(li,L[i].replace(rx,''));ul.appendChild(li);i++}
      box.appendChild(ul);continue}
    if(/^>\s?/.test(ln)){flush();const q=el('blockquote'),t=[];while(i<L.length&&/^>\s?/.test(L[i])){t.push(L[i].replace(/^>\s?/,''));i++}inl(q,t.join('\n'));box.appendChild(q);continue}
    if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){flush();box.appendChild(el('hr'));i++;continue}
    if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1])&&/-/.test(L[i+1])){flush();
      const rows=[];while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i])){rows.push(L[i]);i++}
